<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sri Dharani International School</title>
    <link rel="stylesheet" href="Assets/CSS/style.css">
    <link rel="shortcut icon" href="Assets/Images/favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Sora:wght@100..800&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="header"></div>
    <div id="footer"></div>
        <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap bundle (includes Popper) loaded BEFORE header inject -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

    <script>
        $("#header").load("header.html", function () {

            // Sticky header
            function updateSticky() {
                var $header = $("#mainHeader");
                if ($(window).scrollTop() > 100) {
                    $header.addClass("sticky");
                } else {
                    $header.removeClass("sticky");
                }
            }
            $(window).on("scroll resize", updateSticky);
            updateSticky();

            // Mobile menu toggle — manual only (data-bs-toggle removed from button)
            var togglerBtn = document.querySelector(".navbar-toggler");
            var collapseEl = document.querySelector("#mainNav");

            if (togglerBtn && collapseEl) {
                var bsCollapse = new bootstrap.Collapse(collapseEl, { toggle: false });
                var isOpen = false;

                function openMenu() {
                    bsCollapse.show();
                    isOpen = true;
                    togglerBtn.setAttribute("aria-expanded", "true");
                }

                function closeMenu() {
                    bsCollapse.hide();
                    isOpen = false;
                    togglerBtn.setAttribute("aria-expanded", "false");
                }

                togglerBtn.addEventListener("click", function (e) {
                    e.stopPropagation();
                    if (isOpen) {
                        closeMenu();
                    } else {
                        openMenu();
                    }
                });

                // Sync state when Bootstrap fires events externally
                collapseEl.addEventListener("shown.bs.collapse", function () {
                    isOpen = true;
                    togglerBtn.setAttribute("aria-expanded", "true");
                });
                collapseEl.addEventListener("hidden.bs.collapse", function () {
                    isOpen = false;
                    togglerBtn.setAttribute("aria-expanded", "false");
                });

                // Close menu when a nav-link is tapped on mobile
                collapseEl.querySelectorAll(".nav-link").forEach(function (link) {
                    link.addEventListener("click", function () {
                        if (window.innerWidth < 1200) {
                            closeMenu();
                        }
                    });
                });
            }

        });

        $("#footer").load("footer.html");
    </script>
    <script src="Assets/JS/script.js"></script>
</body>

</html>
